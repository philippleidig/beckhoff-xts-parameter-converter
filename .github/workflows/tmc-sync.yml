name: Sync TMC versions

# Checks the Beckhoff package feed for a new TwinCAT.XAE.TMX.XTS release, extracts the
# TMC files from the installer inside it and regenerates the per-version artifacts the
# app bundles.
#
# Weekly rather than daily: ten driver versions have been published over several years,
# so a daily run spent almost every one of them confirming that nothing had changed.
#
# A run that finds nothing is silent: no commit, no branch, no issue, nothing to read.
# A run that finds something opens a pull request, which is also the only gate the
# change gets — there is no CI on pull requests in this repository, so lint, tests and
# build run here, before the branch is pushed.

on:
  schedule:
    # Mondays at 03:17 UTC — off the hour, where scheduled runs queue up worst.
    - cron: '17 3 * * 1'
  workflow_dispatch:
    inputs:
      max:
        description: 'Maximum number of new versions to fetch in this run'
        required: false
        default: '3'

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: tmc-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - run: npm ci

      # msiextract rebuilds the installer's directory tree and expands CAB streams,
      # which the 7z fallback does not. In CI the good path is required rather than
      # silently degraded to.
      - name: Install msitools
        run: sudo apt-get update && sudo apt-get install -y msitools

      # The credentials are optional: the feed serves some networks anonymously and
      # demands HTTP Basic from others. Unset secrets mean an anonymous request, not a
      # failed run.
      #
      # The feed itself is not configured here. It was, via `vars.TCPKG_FEED`, but an
      # undefined repository variable expands to an empty string rather than being
      # left unset, which produced an empty feed URL. Only the stable feed is read, so
      # it lives in the script as a constant.
      #
      # The step reports the versions it stored as `stored`, and every step below keys
      # off that. Deriving it from `git status` instead is what produced the branch name
      # `tmc-sync/`: a run that only recorded "this package carries no TMC" dirtied the
      # manifest, counted as a find, and then had no version directory to name itself
      # after.
      - name: Fetch new versions from the feed
        id: fetch
        env:
          TCPKG_USERNAME: ${{ secrets.TCPKG_USERNAME }}
          TCPKG_PASSWORD: ${{ secrets.TCPKG_PASSWORD }}
        run: npm run tmc:sync -- --max ${{ inputs.max || 3 }}

      - name: Regenerate the per-version artifacts
        if: steps.fetch.outputs.stored != ''
        run: npm run tmc:generate

      # The only gate this change gets: pull requests in this repository run no checks,
      # so a driver version that no longer describes a parameter the converter writes,
      # or a generated template that lost its structure, has to fail here — before the
      # branch exists and therefore before anyone is asked to review it.
      - name: Verify
        if: steps.fetch.outputs.stored != ''
        run: |
          npm run lint
          npm test
          npm run build

      - name: Open a pull request
        if: steps.fetch.outputs.stored != ''
        env:
          GH_TOKEN: ${{ github.token }}
          STORED: ${{ steps.fetch.outputs.stored }}
        run: |
          versions=$(echo "$STORED" | tr -s ' ' ' ' | sed 's/^ *//;s/ *$//')

          # Belt and braces: the `if:` above already covers this, but naming a branch
          # after an empty list is the failure this step was rewritten to prevent, and
          # `git checkout -b tmc-sync/` is a hard error rather than a no-op.
          if [ -z "$versions" ]; then
            echo "The fetch step stored nothing; not opening a pull request."
            exit 0
          fi

          branch="tmc-sync/$(echo "$versions" | tr ' ' '-')"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$branch"
          git add tmc src/data/tmc
          git commit -m "Add TcIoXts ${versions}" -m "$(node scripts/generate-tmc-data.mjs --check 2>&1 | head -40)"

          # `actions/checkout` fetches only the ref that triggered the run, so nothing
          # under `refs/remotes/origin/` describes this branch. `--force-with-lease` then
          # has no recorded value to compare against and refuses outright — "! [rejected]
          # (stale info)" — which is what failed the re-run after the first attempt had
          # already created the branch. It reads like a permissions problem and is not
          # one. Fetching the branch gives the lease its baseline; when the branch does
          # not exist yet the fetch fails harmlessly and the push creates it.
          git fetch origin "+refs/heads/${branch}:refs/remotes/origin/${branch}" 2>/dev/null || true

          for delay in 2 4 8 16 0; do
            if push_log=$(git push --force-with-lease -u origin "$branch" 2>&1); then
              echo "$push_log"
              break
            fi
            echo "$push_log"

            # A rejection means the branch genuinely moved under us. Sleeping and trying
            # again only reprints the same error four more times and buries the cause.
            case "$push_log" in *'[rejected]'*) exit 1 ;; esac

            [ "$delay" = 0 ] && exit 1
            sleep "$delay"
          done

          # A re-run before the previous pull request was merged updates that branch
          # rather than opening a second one for the same versions.
          if [ -n "$(gh pr list --head "$branch" --state open --json number --jq '.[0].number')" ]; then
            echo "A pull request for $branch is already open; it now has the latest push."
            exit 0
          fi

          gh pr create \
            --head "$branch" \
            --base main \
            --title "Add TcIoXts ${versions}" \
            --body "Automated by \`.github/workflows/tmc-sync.yml\`.

          New driver metadata from the Beckhoff stable feed, with the per-version
          artifacts under \`src/data/tmc\` regenerated from it.

          \`npm run lint\`, \`npm test\` and \`npm run build\` passed against this data
          before the branch was pushed — pull requests here run no checks of their own.
          Worth a look at the diff of \`src/data/tmc/*/dataset.json\` for parameters or
          enum values that changed.

          Merging this triggers the Pages deploy."

      # Only genuine failures are reported. A run that finds no new version is silent,
      # and a run that fails while an issue is already open stays quiet too rather than
      # commenting week after week about the same thing.
      - name: Report a failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          existing=$(gh issue list --label tmc-sync --state open --limit 1 --json number --jq '.[0].number')

          if [ -n "$existing" ]; then
            echo "Issue #$existing is already open for this; not commenting again."
          else
            gh label create tmc-sync --color ededed --description 'Automated TMC feed sync' 2>/dev/null || true
            gh issue create \
              --title "TMC sync failed on $(date -u +%Y-%m-%d)" \
              --label tmc-sync \
              --body "The scheduled TMC sync did not complete: $run_url

          No pull request was opened and nothing was committed. Common causes:

          - the feed answered 401 — it serves some networks anonymously and demands HTTP
            Basic from others; set \`TCPKG_USERNAME\` / \`TCPKG_PASSWORD\` to a myBeckhoff
            account, or check them if they are already set
          - a new driver version dropped a parameter or enum value the converter uses,
            which needs a change to \`scripts/lib/overlay.mjs\`
          - the package layout changed and the TMC files were not found inside it

          \`npm run tmc:generate\` reproduces the generation step locally against the
          versions already in \`tmc/\`."
          fi
